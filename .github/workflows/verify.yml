# Phase 1 safety net: static checks + pin consistency + verify-harness sync +
# daemon-free bats unit suite (tests/bats/; launchers run under --dry-run
# only, docker-dependent shape tests use offline stubs). Live-daemon tests
# (real networks, probe containers, concurrent installs) live in
# tests/bats-live/ under `make test-live`, which CI never runs.
# CI calls make targets (never duplicated step bodies) so a new gate added
# to verify-static runs here automatically (m-23).
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned; tags are movable)

      - name: Install validation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck bats ripgrep jq python3
          python3 -c 'import tomllib'

      - name: verify-static (syntax + configs + generated + pins + shellcheck + bats)
        run: make -C box verify-static

      - name: pins (pin-check + verify-pins-generated over one invariant)
        run: make -C box pins
