#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6.1-sol"

# GPT-6.1 Sol: 1,050,000-token context window
model_context_window = 1_050_000

# Compact before getting too close to the context ceiling.
model_auto_compact_token_limit = 700_000
model_auto_compact_token_limit_scope = "total"

tool_output_token_limit = 8_000
project_doc_max_bytes = 65_536

# GPT-6.1 Sol supports: low, medium, high, xhigh, max
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "high"

model_reasoning_summary = "concise"
personality = "pragmatic"

default_permissions = ":danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "user"
cli_auth_credentials_store = "file"
check_for_update_on_startup = false
sqlite_home = "/persist/state/codex"

web_search = "live"

[agents]
enabled = true
max_concurrent_threads_per_session = 6

# Current-generation lightweight subagent model.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[skills]
max_context_tokens = 8_000

[tools]
web_search = { context_size = "medium" }

[tui]
status_line = [
    "model",
    "reasoning",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
    "five-hour-limit",
    "weekly-limit",
    "context-remaining",
    "task-progress",
    "fast-mode"
]
