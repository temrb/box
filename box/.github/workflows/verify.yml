# Phase 1 safety net: static checks + pin consistency + verify-harness sync +
# bats unit suite. No daemon needed (launchers run under --dry-run only;
# docker-dependent bats tests skip when no docker binary is present or no
# daemon is reachable; live network tests create/remove real networks).
# Keep the bash/shellcheck file lists in sync with Makefile SHELL_FILES.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned; tags are movable)

      - name: Install shellcheck and bats
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck bats

      - name: bash syntax
        run: |
          for f in lib/preflight.sh lib/tools.sh lib/docker.sh lib/launcher.sh lib/run.sh lib/pins.sh lib/build.sh lib/config.sh box-m box-o box-m-login verify-muse.sh verify-opencode.sh setup.sh check-pins.sh gen-verify.sh gen-pins.sh regen-validation.sh; do bash -n "$f" || exit 1; done
          for f in verify.d/*.sh; do bash -n "$f" || exit 1; done

      - name: shellcheck
        run: shellcheck lib/preflight.sh lib/tools.sh lib/docker.sh lib/launcher.sh lib/run.sh lib/pins.sh lib/build.sh lib/config.sh box-m box-o box-m-login verify-muse.sh verify-opencode.sh setup.sh check-pins.sh gen-verify.sh gen-pins.sh regen-validation.sh

      - name: JSON validity
        run: |
          cfgs=$(BOX_TOOL=ci bash -c 'source lib/tools.sh && for _i in $box_tool_ids; do printf "%s " "$(box_tool_field $_i config_file)"; done')
          [ -n "$cfgs" ] || { echo "cannot load tool configs from lib/tools.sh" >&2; exit 1; }
          for f in $cfgs; do python3 -m json.tool "$f" >/dev/null; done

      - name: pins (pin-check + verify-pins-generated over one invariant)
        run: make pins

      - name: verify-generated (verify-*.sh == verify.d/ output)
        run: make verify-generated

      - name: bats
        run: make test
